<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _("Cadastro Cliente") }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles_base.css') }}"> 
  <link rel="stylesheet" href="{{ url_for('static', filename='styles_cliente.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Passion+One:wght@400;700;900&family=Racing+Sans+One&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="container">
    <a href="javascript:history.back()" class="voltar">&lt;</a>
    <h1 class="logo">
      <span style="color: rgb(0, 192, 188);">She</span>Moves
    </h1>
    <div class="form-container">
      <h2 class="form-title">{{ _("Cadastre-se") }}</h2>
      <form action="/cadastro-cliente" id="login-form" method="POST">
        <label for="nome">{{ _("Nome completo:") }}</label>
        <input type="text" id="nome" name="nome" required>

        <label for="data_nascimento">{{ _("Data de nascimento:") }}</label>
        <input type="date" id="data_nascimento" name="nascimento" required>

        <label for="cref">{{ _("CPF:") }}</label>
        <input type="text" id="cpf" name="cpf" required>

        <label for="email">{{ _("E-mail:") }}</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">{{ _("Senha:") }}</label>
        <input type="password" id="senha" name="senha" required>

        <div class="password-checklist" id="password-checklist">
          <span id="check-length" class="check-item">{{ _("• Pelo menos 8 caracteres") }}</span><br>
          <span id="check-number" class="check-item">{{ _("• Pelo menos 1 número") }}</span><br>
          <span id="check-special" class="check-item">{{ _("• Pelo menos 1 caractere especial") }}</span>
        </div>

        <button type="submit" class="submit-btn">{{ _("Cadastrar") }}</button>
      </form>
    </div>
  </div>
  <script src="{{ url_for('static', filename='login.js') }}">
  document.getElementById('login-form').addEventListener('submit', function (e) {
    const dataNascimento = new Date(document.getElementById('data_nascimento').value);
    const hoje = new Date();

    const idade = hoje.getFullYear() - dataNascimento.getFullYear();
    const mes = hoje.getMonth() - dataNascimento.getMonth();
    const dia = hoje.getDate() - dataNascimento.getDate();

    let idadeReal = idade;
    if (mes < 0 || (mes === 0 && dia < 0)) {
      idadeReal--;
    }

    if (idadeReal < 13) {
      e.preventDefault(); // Impede envio do formulário
      alert("Você deve ter pelo menos 13 anos para se cadastrar.");
    }
  });
</script>

</body>

</html>
